name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Compilar Angular
        run: npm run build -- --base-href "/Daniceballosceo/"

      - name: Preparar archivos publicados
        shell: bash
        run: |
          rm -rf site
          mkdir site

          BROWSER_DIR="$(find dist -type d -name browser -print -quit)"

          if [ -n "$BROWSER_DIR" ]; then
            cp -R "$BROWSER_DIR"/. site/
          else
            DIST_DIR="$(find dist -mindepth 1 -maxdepth 1 -type d -print -quit)"
            cp -R "$DIST_DIR"/. site/
          fi

          touch site/.nojekyll

      - name: Subir archivos de GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4